# Production stack for a single Linux VPS. See docs/DEPLOY-VPS.md.
name: puruz

x-app: &app
  build: .
  image: puruz-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DB_HOST: mariadb
    REDIS_HOST: redis
  volumes:
    - storage:/app/storage
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    command: ["web"]
    environment:
      DB_HOST: mariadb
      REDIS_HOST: redis
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config

  worker:
    <<: *app
    command: ["worker"]
    environment:
      DB_HOST: mariadb
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"

  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      DB_HOST: mariadb
      REDIS_HOST: redis
      RUN_MIGRATIONS: "false"

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-puruz}
      MARIADB_USER: ${DB_USERNAME:-puruz}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env içinde tanımlı olmalı}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD .env içinde tanımlı olmalı}
      TZ: Europe/Istanbul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_turkish_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backup:
    image: mariadb:11.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-puruz}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Istanbul
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/storage:ro
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  storage:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
